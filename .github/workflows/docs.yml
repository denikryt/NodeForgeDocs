name: Deploy documentation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve documentation version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a release tag in the form vX.Y.Z, got: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install documentation dependencies
        run: pip install mkdocs pymdown-extensions mike

      - name: Validate documentation
        run: mkdocs build --strict

      - name: Fetch existing versioned site
        run: git fetch origin gh-pages:gh-pages || true

      - name: Configure documentation deploy identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish versioned documentation
        shell: bash
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
          MAKE_LATEST: ${{ steps.version.outputs.make_latest }}
        run: |
          if [[ "$MAKE_LATEST" == "true" ]]; then
            mike deploy --push --alias-type=redirect --update-aliases "$DOCS_VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push --alias-type=redirect "$DOCS_VERSION"
          fi

      - name: Export versioned site
        run: |
          rm -rf site-versioned
          mkdir site-versioned
          git archive gh-pages | tar -x -C site-versioned

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-versioned

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
